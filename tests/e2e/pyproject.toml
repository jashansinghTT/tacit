[project]
name = "tacit-e2e"
version = "0.1.0"
description = "End-to-end tests of the Tacit flows (SPEC section 9) against the real stack"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pytest>=8",
  "httpx>=0.27",
  "websockets>=13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra -p no:cacheprovider"
markers = ["flow(n): the SPEC section 9 flow this test covers"]
