[project]
name = "tacit-backend"
version = "0.1.0"
description = "Tacit backend: capture, lesson, robot and exchange APIs over the Tenstorrent model stack"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic>=2.8",
  "sqlmodel>=0.0.22",
  "pyyaml>=6",
  "numpy>=1.26,<2.3",
  "opencv-python-headless>=4.10",
  "mediapipe>=0.10.14",
  "pillow>=10",
  "python-multipart>=0.0.12",
  "soundfile>=0.12",
  "orjson>=3.10",
  "markdown>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]
sim = ["mujoco>=3.2", "torch>=2.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tacit*"]
